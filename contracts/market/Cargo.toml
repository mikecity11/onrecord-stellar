[package]
name = "promise-market"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
soroban-sdk = "23.0.3"
[dev-dependencies]
soroban-sdk = { version = "23.0.3", features = ["testutils"] }
[profile.release]
opt-level = "z"
overflow-checks = true
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
